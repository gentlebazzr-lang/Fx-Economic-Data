name: Run Scraper
on:
 schedule:
   - cron: '0 0 * * 0'
   - cron: '0 0 * * 1'
 workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout code
         uses: actions/checkout@v3
       - name: Set up Python
         uses: actions/setup-python@v4
         with:
           python-version: '3.9'
       - name: Install dependencies
         run: pip install requests
       - name: Run script
         run: python -u main.py
