name: Run Scraper
on:
 schedule:
   - cron: '0 0 * * 0'
   - cron: '0 0 * * 1'
 workflow_dispatch: 

permissions:
   contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout code
         uses: actions/checkout@v3
       - name: Set up Python
         uses: actions/setup-python@v4
         with:
           python-version: '3.9'
       - name: Install dependencies
         run: pip install requests
       - name: Run script and Save Output
         run:  python -u main.py > output.txt

       - name: View Log Output
         run: cat output.txt

       - name: Send Email Notification
         uses: dawidd6/action-send-mail@v3
         with:
            server_address: smtp.gmail.com
            server_port: 465
            username: derinneganuser@gmail.com
            password: ${{secrets.MAIL_PASSWORD}}
            subject: "Forex Factory's Filtered Data Updated"
            to: gentlebazzr@gmail.com
            from: "GitHub Scraper Automation"
            body: file://output.txt

       - name: Commit and Push Data Files
         run: |
             git config --global user.name "GitHub Actions Automation"
             git config --global user.email "actions@github.com"
             git add output.txt news_data.json
             git commit -m "Automated Economic Data Feed Update [skip ci]" ||
             echo "No changes  to commit"
                     git push
